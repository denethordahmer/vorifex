<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vorifex's Tithe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <header id="statsPanel">
      <div class="stat-row">
        <div class="stat">
          <span class="label">Devotion</span>
          <span class="value" id="statDevotion">0</span>
        </div>
        <div class="stat">
          <span class="label">Tithe Stash</span>
          <span class="value" id="statStash">0</span>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat">
          <span class="label">Gen Rate</span>
          <span class="value" id="statRate">0/s</span>
        </div>
        <div class="stat">
          <span class="label">Crit Chance</span>
          <span class="value" id="statCritChance">0%</span>
        </div>
        <div class="stat">
          <span class="label">Crit Range</span>
          <span class="value" id="statCritRange">1.00x - 1.00x</span>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat wide">
          <span class="label">Achievement Window</span>
          <span class="value" id="statWindow">inactive</span>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat wide">
          <span class="label">Prestige Projection</span>
          <span class="value" id="statProjection">Locked</span>
        </div>
      </div>
    </header>

    <main id="canvasWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="tapHint">TAP THE CORE</div>
    </main>

    <section id="upgrades">
      <button class="upgradeBtn" id="btnPath1" data-path="1">
        <span class="upTitle">Path 1: Critical Chance</span>
        <span class="upLevel" id="lvlPath1">Lv. 0</span>
        <span class="upCost" id="costPath1">Cost: —</span>
      </button>

      <button class="upgradeBtn" id="btnPath2" data-path="2">
        <span class="upTitle">Path 2: Extraction Rate</span>
        <span class="upLevel" id="lvlPath2">Lv. 0</span>
        <span class="upCost" id="costPath2">Cost: —</span>
      </button>

      <button class="upgradeBtn" id="btnPath3" data-path="3">
        <span class="upTitle">Path 3: Tithe Synergy</span>
        <span class="upLevel" id="lvlPath3">Lv. 0</span>
        <span class="upCost" id="costPath3">Cost: —</span>
      </button>
    </section>

    <section id="actions">
      <button id="btnPrestige" class="actionBtn primary">PRESTIGE</button>
      <button id="btnDebugAchievement" class="actionBtn debug">Debug: Trigger Window</button>
    </section>

    <footer id="saveIndicator">
      <span id="saveStatus">Loaded</span>
    </footer>

  </div>

  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
